version: '3.9'

services:
  frontend:
    build:
      context: .
      args:
        VITE_API_HOST: ${VITE_API_HOST:-localhost}
        VITE_API_PORT: ${VITE_API_PORT:-15567}
    ports:
      - '80:80'
    depends_on:
      - backend

  # Replace with your actual backend service definition
  backend:
    image: your-backend-image
    ports:
      - '15567:15567'
